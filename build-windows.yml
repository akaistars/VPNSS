name: Build Windows demo

on:
  workflow_dispatch:
  push:
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Windows app
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Flutter project structure
        shell: bash
        run: |
          mkdir -p lib
          if [ -f main.dart ] && [ ! -f lib/main.dart ]; then mv main.dart lib/main.dart; fi
          if [ -f demo_auth_gate.dart ] && [ ! -f lib/demo_auth_gate.dart ]; then mv demo_auth_gate.dart lib/demo_auth_gate.dart; fi
          if [ -f split_tunnel_screen.dart ] && [ ! -f lib/split_tunnel_screen.dart ]; then mv split_tunnel_screen.dart lib/split_tunnel_screen.dart; fi
          if [ ! -d windows ]; then flutter create --platforms=windows .; fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: SpiderVPN-Windows-Demo
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
